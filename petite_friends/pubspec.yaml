name: petite_friends
description: A virtual pet care game with widget support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Widget
  home_widget: ^0.4.1
  workmanager: ^0.5.2

  # Notifications
  flutter_local_notifications: ^16.3.0
  firebase_messaging: ^14.7.9

  # Ads
  google_mobile_ads: ^4.0.0

  # In-App Purchase
  in_app_purchase: ^3.1.11

  # Game Engine
  flame: ^1.12.0

  # Animations
  lottie: ^2.7.0
  rive: ^0.12.4

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9

  # Utils
  intl: ^0.18.1
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/pets/
    - assets/images/backgrounds/
    - assets/images/items/
    - assets/animations/

  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Regular.ttf
        - asset: fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: fonts/Pretendard-SemiBold.ttf
          weight: 600
