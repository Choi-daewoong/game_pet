name: petite_friends
description: A virtual pet care game with widget support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Widget
  home_widget: ^0.4.1
  workmanager: ^0.5.2

  # Notifications (temporarily disabled for build)
  # flutter_local_notifications: ^16.3.0
  # timezone: ^0.9.2

  # Ads
  google_mobile_ads: ^4.0.0

  # UI
  cupertino_icons: ^1.0.6

  # Utils
  intl: ^0.18.1
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
