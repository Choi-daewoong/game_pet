name: Build Flutter APK

on:
  push:
    branches:
      - claude/review-pet-widget-game-01UBJTbD56z2133PKiS9vMt7
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./petite_friends
        run: flutter pub get

      - name: Build APK
        working-directory: ./petite_friends
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petite-friends-release
          path: petite_friends/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Petite Friends v1.0.0-${{ github.run_number }}
          body: |
            ## 🎮 Petite Friends - 가상 펫 케어 앱

            자동 빌드된 APK 파일입니다.

            ### 주요 기능
            - ✅ 완전한 온보딩 플로우
            - ✅ 펫 상태 관리 (배고픔, 청결도, 기분, 피로도, 건강)
            - ✅ 2개의 미니게임 (점프 게임, 야바위 게임)
            - ✅ 병원 시스템 (무료/유료 치료)
            - ✅ 상점 시스템
            - ✅ Android 홈 위젯
            - ✅ 수면 모드 (밤 10시 - 오전 7시)
            - ✅ 알림 시스템

            ### 설치 방법
            1. APK 파일 다운로드
            2. 안드로이드 기기에서 "알 수 없는 출처" 허용
            3. APK 설치
          files: petite_friends/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
