name: Build Web Preview

on:
  push:
    branches:
      - claude/review-pet-widget-game-01UBJTbD56z2133PKiS9vMt7
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./petite_friends
        run: flutter pub get

      - name: Build Web
        working-directory: ./petite_friends
        run: flutter build web --release

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: petite_friends/build/web

