name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/review-pet-widget-game-01UBJTbD56z2133PKiS9vMt7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./petite_friends
        run: flutter pub get

      - name: Build Web
        working-directory: ./petite_friends
        run: flutter build web --release --base-href "/game_pet/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'petite_friends/build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
